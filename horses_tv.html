<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORSES TV - SECURE</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: white; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    .video-container { width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="mainContainer" class="video-container">
    <div id="errorMessage" style="display:none; text-align: center;">
        <h2>Acceso No Autorizado</h2>
        <p>Este contenido solo está disponible en Luxury Video.</p>
    </div>
    <iframe id="horsesFrame" style="display:none;"
      title="Horses TV"
      allow="autoplay; encrypted-media; fullscreen;"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    /**
     * SEGURIDAD: Validación de Origen Flexible
     * Aceptamos peticiones que vengan de tus dos dominios de Render.
     */
    const dominiosValidos = [
        "luxuryvideofrontend.onrender.com",
        "luxuryvideo.onrender.com"
    ];
    
    const referrer = document.referrer;
    // Verificamos si el origen coincide con alguno de tus dominios
    const esAutorizado = dominiosValidos.some(dominio => referrer.includes(dominio));

    // Si quieres ser menos estricto mientras pruebas, puedes comentar el "if" de bloqueo
    // pero para producción, mantén esta lógica:
    if (referrer !== "" && !esAutorizado) {
        document.getElementById("errorMessage").style.display = "block";
        console.error("Bloqueo: Origen no autorizado ->", referrer);
    } else {
        const params = new URLSearchParams(window.location.search);
        const id = (params.get("id") || "").trim();

        if (!id) {
          document.getElementById("errorMessage").innerHTML = "<h2>ID de canal faltante</h2>";
          document.getElementById("errorMessage").style.display = "block";
        } else {
          const horsesFrame = document.getElementById("horsesFrame");
          horsesFrame.style.display = "block";
          horsesFrame.src = `https://stream-horsetv.net/${encodeURIComponent(id)}/s.php`;
        }
    }
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
