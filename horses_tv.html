<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORSES TV - PROTECTED</title>
  <style>
    /* Eliminamos el FLEX para que el video use todo el ancho disponible */
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0;
      background: #000; 
      color: white; 
      overflow: hidden;
    }
    .video-container { width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    
    #errorMessage {
      display: none;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="mainContainer" class="video-container">
    <!-- Mensaje de error (ahora es un flexbox propio para centrar el texto) -->
    <div id="errorMessage">
        <h2 style="color: #ff4d4d;">Acceso No Autorizado</h2>
        <p>Este contenido solo está disponible desde el portal oficial de Luxury Video.</p>
    </div>
    
    <iframe id="horsesFrame"
      title="Horses TV"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <script>
    /**
     * SEGURIDAD AVANZADA:
     * 1. Validar dominio si existe Referrer.
     * 2. Bloquear si intentan abrir el link directamente en una pestaña (fuera de iframe).
     */
    const dominiosValidos = [
        "luxuryvideofrontend.onrender.com",
        "luxuryvideo.onrender.com",
        "render.com"
    ];
    
    const referrer = document.referrer;
    const esAutorizado = dominiosValidos.some(dominio => referrer.includes(dominio));
    
    // Verificamos si la página está metida dentro de un iframe (nuestro caso legítimo)
    const estaEnIframe = (window.self !== window.top);

    // LÓGICA DE BLOQUEO:
    // Bloqueamos si: 
    // - Hay un origen y no es el nuestro (intento de robo desde otra web)
    // - O si NO estamos en un iframe (intento de abrir el link directo en el navegador)
    if ((referrer !== "" && !esAutorizado) || (!estaEnIframe)) {
        document.getElementById("horsesFrame").remove(); 
        document.getElementById("errorMessage").style.display = "flex";
        console.error("Acceso denegado: Este contenido no permite visualización directa.");
    } else {
        // CASO EXITOSO: Estamos dentro de la app o el referrer es correcto
        const params = new URLSearchParams(window.location.search);
        const id = (params.get("id") || "").trim();

        if (id) {
          const horsesFrame = document.getElementById("horsesFrame");
          horsesFrame.src = `https://stream-horsetv.net/${encodeURIComponent(id)}/s.php`;
          horsesFrame.style.display = "block";
        }
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
